# Local Postgres for development and for the end-to-end tests.
#   docker compose up -d
#   export DATABASE_URL=postgres://postgres:postgres@localhost:5432/gateway
#   export TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
