[package]
name = "gateway-server"
description = "WhatsApp gateway: webhook receiver, durable event store, Graph API transport, demo bot."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "gateway_server"
path = "src/lib.rs"

[[bin]]
name = "gateway-server"
path = "src/main.rs"

[dependencies]
gateway-core = { path = "../gateway-core" }

anyhow.workspace = true
async-trait = "0.1"
axum = "0.8"
hex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "json"] }
thiserror.workspace = true
tokio.workspace = true
tokio-util = "0.7"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
wiremock = "0.6"
